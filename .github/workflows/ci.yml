name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cli:
    name: TypeScript CLI (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['18', '20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm ci
      - name: Lint
        run: npm run lint -w packages/cli
      - name: Typecheck
        run: npm run typecheck -w packages/cli
      - name: Build
        run: npm run build -w packages/cli
      - name: Smoke test the built CLI
        run: |
          node packages/cli/bin/apex.js --version
          node packages/cli/bin/apex.js version
          node packages/cli/bin/apex.js config --show
      - name: Verify the publish tarball
        working-directory: packages/cli
        run: npm pack --dry-run

  python-sdk:
    name: Python SDK (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        working-directory: packages/python-sdk
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint with ruff
        working-directory: packages/python-sdk
        run: ruff check apex_pred/ tests/
      - name: Type check
        working-directory: packages/python-sdk
        run: mypy apex_pred/
      - name: Run tests
        working-directory: packages/python-sdk
        run: pytest tests/ -v --cov=apex_pred --cov-report=xml
      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          file: packages/python-sdk/coverage.xml
          fail_ci_if_error: false

  packaging:
    name: Package build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build the npm package
        run: |
          npm ci
          npm run build -w packages/cli
      - name: Pack the npm tarball
        working-directory: packages/cli
        run: npm pack
      - name: Install the packed tarball and run the binaries
        run: |
          npm install -g packages/cli/apex-pred-cli-*.tgz
          apex --version
          apex-pred --version

      - name: Build the Python sdist and wheel
        working-directory: packages/python-sdk
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
      - name: Install the wheel in a clean venv and run it
        working-directory: packages/python-sdk
        run: |
          python -m venv /tmp/wheel-check
          /tmp/wheel-check/bin/pip install dist/*.whl
          /tmp/wheel-check/bin/apex-pred --version
          /tmp/wheel-check/bin/apex-pred config --show
