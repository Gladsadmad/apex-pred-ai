[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apex-pred-ai"
version = "1.0.0"
description = "Apex-Pred AI — the apex predator of AI assistants"
readme = "README.md"
requires-python = ">=3.10"
# PEP 639 SPDX expression — must not be paired with a "License ::" classifier
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Gladsadmad" }]
keywords = ["ai", "assistant", "cli", "anthropic", "claude", "terminal", "coding-assistant"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries",
  "Topic :: Utilities",
]

dependencies = [
  "anthropic>=0.39.0",
  "rich>=13.7.0",
  "typer>=0.12.0",
  "httpx>=0.27.0",
  "python-dotenv>=1.0.0",
  "platformdirs>=4.2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
  "pytest-cov>=5.0.0",
  "mypy>=1.10.0",
  "ruff>=0.4.0",
]

[project.urls]
Homepage = "https://github.com/Gladsadmad/apex-pred-ai"
Repository = "https://github.com/Gladsadmad/apex-pred-ai"
Issues = "https://github.com/Gladsadmad/apex-pred-ai/issues"
Changelog = "https://github.com/Gladsadmad/apex-pred-ai/blob/master/CHANGELOG.md"

[project.scripts]
apex-pred = "apex_pred.cli:app"

# Tell setuptools exactly where the package lives (replaces the ignored hatch section)
[tool.setuptools.packages.find]
where = ["."]
include = ["apex_pred*"]

# Ship the PEP 561 marker so consumers get our type hints
[tool.setuptools.package-data]
apex_pred = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# Typer's whole API is calls-in-defaults; those objects are immutable markers
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
